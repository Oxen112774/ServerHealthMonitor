name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least privilege: the build/test jobs only need to read the repository.
permissions:
  contents: read

env:
  GO_VERSION: '1.23'
  AGENT_BINARY: 'server-health-monitor-agent'
  CONSOLE_BINARY: 'server-health-monitor-console'

jobs:
  # ---------- Verify + build Go binaries ----------
  build:
    name: Verify & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请运行 gofmt -w ./cmd ./internal"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build agent (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w -X main.version=${{ github.sha }} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o build/${{ env.AGENT_BINARY }} \
            ./cmd/agent

      - name: Build console (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w -X main.version=${{ github.sha }} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o build/${{ env.CONSOLE_BINARY }} \
            ./cmd/console

      - name: Verify binaries
        run: |
          file build/${{ env.AGENT_BINARY }}
          file build/${{ env.CONSOLE_BINARY }}
          ls -lh build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-health-monitor-linux-amd64
          path: |
            build/${{ env.AGENT_BINARY }}
            build/${{ env.CONSOLE_BINARY }}
          retention-days: 30

  # ---------- Deploy agent to server ----------
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: server-health-monitor-linux-amd64
          path: build/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deploy dependencies
        run: |
          pip install paramiko scp

      - name: Deploy via Python script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          chmod +x build/${{ env.AGENT_BINARY }}
          python deploy/deploy.py \
            --host "$DEPLOY_HOST" \
            --port "$DEPLOY_PORT" \
            --user "$DEPLOY_USER" \
            --key "$DEPLOY_KEY" \
            --binary "build/${{ env.AGENT_BINARY }}"

      - name: Verify deployment
        run: |
          echo "Deployment completed. Verify at http://${{ secrets.DEPLOY_HOST }}:8080/"